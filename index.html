<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Fashion Tailoring Industry</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#f5f0e9;color:#211b22}
.wrap{width:min(94%,560px);margin:35px auto}
.card{background:#fff;border:1px solid #ddd5cc;border-radius:28px;padding:34px 30px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
h1{margin:0;font-size:clamp(32px,8vw,52px);line-height:1.05;font-weight:800}
.gold{margin:10px 0 0;color:#d5a948;font-size:clamp(28px,7vw,46px);line-height:1.05;font-weight:800}
.sub{margin:32px 0 42px;color:#777176;font-size:clamp(24px,6vw,34px)}
label{display:block;margin:0 0 10px;font-size:20px;font-weight:700}
input{width:100%;height:66px;margin-bottom:24px;padding:0 18px;border:1px solid #d4cec8;border-radius:18px;font-size:18px;outline:none}
input:focus{border-color:#b13d63;box-shadow:0 0 0 3px rgba(177,61,99,.12)}
button{width:100%;min-height:62px;border:0;border-radius:18px;padding:14px 18px;font-size:19px;font-weight:700;cursor:pointer}
#loginBtn{background:#b13d63;color:#fff}
#loginBtn:disabled{opacity:.65;cursor:wait}
.msg{min-height:24px;margin-top:16px;text-align:center;font-size:15px;line-height:1.4}
.err{color:#c62828}.ok{color:#218838}.hidden{display:none!important}
.dash-header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:24px}
.dash-header h2{margin:0;font-size:30px}
.user-email{margin-top:7px;color:#777176;word-break:break-word}
#logoutBtn{width:auto;min-width:110px;background:#eee7e1;color:#7d2946}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:25px}
.stat{padding:22px;background:#faf8f6;border:1px solid #e2dcd5;border-radius:18px}
.stat-title{color:#777176;font-size:15px;margin-bottom:10px}
.stat-number{font-size:30px;font-weight:800}
#refreshBtn{margin-top:20px;background:#2f6f59;color:white}
@media(max-width:480px){.wrap{margin:18px auto}.card{padding:26px 20px;border-radius:22px}.dash-header{align-items:flex-start;flex-direction:column}#logoutBtn{width:100%}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">

<section id="loginCard" class="card">
<h1>NEW FASHION</h1>
<div class="gold">TAILORING INDUSTRY</div>
<div class="sub">Mobile Tailoring Software</div>

<form id="loginForm">
<label for="email">Email</label>
<input id="email" type="email" placeholder="உங்கள் Email" autocomplete="email" required>

<label for="password">Password</label>
<input id="password" type="password" placeholder="Password" autocomplete="current-password" required>

<button id="loginBtn" type="submit">🔐 LOGIN</button>
</form>
<div id="loginMsg" class="msg"></div>
</section>

<section id="dashboard" class="card hidden">
<div class="dash-header">
<div>
<h2>Tailoring Dashboard</h2>
<div id="userEmail" class="user-email"></div>
</div>
<button id="logoutBtn" type="button">LOGOUT</button>
</div>

<div class="stats">
<div class="stat"><div class="stat-title">Customers</div><div class="stat-number">0</div></div>
<div class="stat"><div class="stat-title">Payments</div><div class="stat-number">0</div></div>
<div class="stat"><div class="stat-title">Alterations</div><div class="stat-number">0</div></div>
<div class="stat"><div class="stat-title">Designs</div><div class="stat-number">0</div></div>
</div>

<button id="refreshBtn" type="button">🔄 Refresh Dashboard</button>
<div id="dashMsg" class="msg"></div>
</section>

</main>

<script>
/* SUPABASE CONFIGURATION
   Replace only the two values below.
   Use your Project URL and Publishable key.
   Do NOT use a secret/service_role key in this page.
*/
const SUPABASE_URL = "https://yjkyflusegxaqfvpeklb.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_-NK1gubUvsc47KKDV8DNKQ_I5pbx-sR";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const loginCard = document.getElementById("loginCard");
const dashboard = document.getElementById("dashboard");
const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const refreshBtn = document.getElementById("refreshBtn");
const loginMsg = document.getElementById("loginMsg");
const dashMsg = document.getElementById("dashMsg");
const userEmail = document.getElementById("userEmail");

function showLogin(){
  loginCard.classList.remove("hidden");
  dashboard.classList.add("hidden");
}

function showDashboard(user){
  loginCard.classList.add("hidden");
  dashboard.classList.remove("hidden");
  userEmail.textContent = user && user.email ? user.email : "";
}

function setLoginMessage(text,isError){
  loginMsg.textContent = text;
  loginMsg.className = "msg " + (isError ? "err" : "ok");
}

function setDashMessage(text,isError){
  dashMsg.textContent = text;
  dashMsg.className = "msg " + (isError ? "err" : "ok");
}

loginForm.addEventListener("submit",async function(event){
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  setLoginMessage("",false);

  if(!email || !password){
    setLoginMessage("Email மற்றும் Password இரண்டையும் உள்ளிடுங்கள்.",true);
    return;
  }

  if(
    !SUPABASE_URL ||
    !SUPABASE_PUBLISHABLE_KEY ||
    SUPABASE_URL === "YOUR_SUPABASE_URL" ||
    SUPABASE_PUBLISHABLE_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
  ){
    setLoginMessage("Supabase configuration missing.",true);
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  try{
    const {data,error} = await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });

    if(error){
      setLoginMessage("Login failed: " + error.message,true);
      return;
    }

    if(data && data.user){
      showDashboard(data.user);
    }else{
      setLoginMessage("Login செய்ய முடியவில்லை. மீண்டும் முயற்சி செய்யுங்கள்.",true);
    }
  }catch(error){
    setLoginMessage("Login failed: " + (error.message || error),true);
  }finally{
    loginBtn.disabled = false;
    loginBtn.textContent = "🔐 LOGIN";
  }
});

logoutBtn.addEventListener("click",async function(){
  logoutBtn.disabled = true;

  const {error} = await supabaseClient.auth.signOut();

  logoutBtn.disabled = false;

  if(error){
    setDashMessage("Logout failed: " + error.message,true);
    return;
  }

  setDashMessage("",false);
  showLogin();
});

refreshBtn.addEventListener("click",function(){
  setDashMessage("Dashboard refreshed.",false);
});

supabaseClient.auth.onAuthStateChange(function(_event,session){
  if(session && session.user){
    showDashboard(session.user);
  }else{
    showLogin();
  }
});

async function startApp(){
  try{
    const {data,error} = await supabaseClient.auth.getSession();

    if(error){
      showLogin();
      return;
    }

    if(data.session && data.session.user){
      showDashboard(data.session.user);
    }else{
      showLogin();
    }
  }catch(error){
    showLogin();
  }
}

startApp();
</script>
</body>
</html>
