<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Fashion Tailoring Industry</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f6f1eb;
      color: #241d25;
    }
    .wrap { width: min(900px, 94%); margin: 30px auto; }
    .card {
      background: #fff;
      border: 1px solid #ddd6cf;
      border-radius: 26px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,.07);
    }
    h1 { margin: 0; font-size: 44px; }
    h2 { margin: 0; font-size: 30px; }
    .gold { margin-top: 12px; color: #d4aa4f; font-size: 38px; font-weight: 800; }
    .sub { margin: 28px 0; color: #706a6e; font-size: 22px; }
    label { display: block; margin: 16px 0 8px; font-weight: 700; }
    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #d5d0ca;
      border-radius: 14px;
      font-size: 17px;
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    #loginBtn {
      width: 100%;
      margin-top: 22px;
      background: #b23e62;
      color: white;
    }
    .row { display: flex; gap: 10px; margin-top: 22px; }
    .row button { flex: 1; }
    #refreshBtn { background: #eee9e4; }
    #logoutBtn { background: #b23e62; color: white; }
    .msg { min-height: 24px; margin-top: 12px; font-weight: 600; }
    .error { color: #b42318; }
    .success { color: #16794c; }
    .hidden { display: none; }
    .email { color: #706a6e; margin-top: 8px; word-break: break-word; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 24px;
    }
    .stat {
      padding: 20px;
      border: 1px solid #e0dad4;
      border-radius: 16px;
    }
    .stat-title { color: #706a6e; font-weight: 700; }
    .stat-number { margin-top: 8px; font-size: 30px; font-weight: 800; }
    @media (max-width: 600px) {
      .wrap { width: 96%; margin: 10px auto; }
      .card { padding: 22px; }
      h1 { font-size: 34px; }
      .gold { font-size: 29px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section id="loginCard" class="card">
      <h1>NEW FASHION</h1>
      <div class="gold">TAILORING INDUSTRY</div>
      <div class="sub">Mobile Tailoring Software</div>

      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="உங்கள் Email">

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Password">

        <button id="loginBtn" type="submit">🔐 LOGIN</button>
        <div id="loginMsg" class="msg"></div>
      </form>
    </section>

    <section id="dashboard" class="card hidden">
      <h2>NEW FASHION TAILORING</h2>
      <div id="userEmail" class="email"></div>
      <div id="dashMsg" class="msg success">Login successful</div>

      <div class="grid">
        <div class="stat">
          <div class="stat-title">Customers</div>
          <div class="stat-number">—</div>
        </div>
        <div class="stat">
          <div class="stat-title">Payments</div>
          <div class="stat-number">—</div>
        </div>
        <div class="stat">
          <div class="stat-title">Alterations</div>
          <div class="stat-number">—</div>
        </div>
        <div class="stat">
          <div class="stat-title">Designs</div>
          <div class="stat-number">—</div>
        </div>
      </div>

      <div class="row">
        <button id="refreshBtn" type="button">↻ Refresh</button>
        <button id="logoutBtn" type="button">LOGOUT</button>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://yjkyflusegxaqfvpeklb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-NK1gubUvsc47KKDV8DNKQ_I5pbx-sR";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginCard = document.getElementById("loginCard");
    const dashboard = document.getElementById("dashboard");
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const loginMsg = document.getElementById("loginMsg");
    const userEmail = document.getElementById("userEmail");
    const dashMsg = document.getElementById("dashMsg");
    const refreshBtn = document.getElementById("refreshBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    function showLogin() {
      loginCard.classList.remove("hidden");
      dashboard.classList.add("hidden");
    }

    function showDashboard(user) {
      loginCard.classList.add("hidden");
      dashboard.classList.remove("hidden");
      userEmail.textContent = user && user.email ? user.email : "";
    }

    function showError(message) {
      loginMsg.textContent = message;
      loginMsg.className = "msg error";
    }

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      loginMsg.textContent = "";
      loginMsg.className = "msg";

      if (!email || !password) {
        showError("Email மற்றும் Password இரண்டையும் உள்ளிடுங்கள்.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      try {
        const result = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (result.error) {
          showError("Login failed: " + result.error.message);
          return;
        }

        if (result.data && result.data.user) {
          showDashboard(result.data.user);
        } else {
          showError("Login failed: User was not returned.");
        }
      } catch (error) {
        showError("Login failed: " + error.message);
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "🔐 LOGIN";
      }
    });

    logoutBtn.addEventListener("click", async function () {
      const result = await supabaseClient.auth.signOut();

      if (result.error) {
        dashMsg.textContent = "Logout failed: " + result.error.message;
        dashMsg.className = "msg error";
        return;
      }

      passwordInput.value = "";
      showLogin();
    });

    refreshBtn.addEventListener("click", async function () {
      const result = await supabaseClient.auth.getUser();

      if (result.error || !result.data || !result.data.user) {
        showLogin();
        return;
      }

      showDashboard(result.data.user);
      dashMsg.textContent = "Session is active";
      dashMsg.className = "msg success";
    });

    supabaseClient.auth.onAuthStateChange(function (_event, session) {
      if (session && session.user) {
        showDashboard(session.user);
      } else {
        showLogin();
      }
    });

    async function startApp() {
      try {
        const result = await supabaseClient.auth.getSession();

        if (
          result.data &&
          result.data.session &&
          result.data.session.user
        ) {
          showDashboard(result.data.session.user);
        } else {
          showLogin();
        }
      } catch (error) {
        showLogin();
      }
    }

    startApp();
  </script>
</body>
</html>
