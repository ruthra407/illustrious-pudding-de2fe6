name: Android 16 Back Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor app
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ruthra407.tailoring",
            "appName": "New Fashion Tailoring",
            "webDir": "www"
          }
          EOF

          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp icon-192.png www/
          cp icon-512.png www/

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android Back
        run: |
          mkdir -p android/app/src/main/java/com/ruthra407/tailoring

          cat > android/app/src/main/java/com/ruthra407/tailoring/MainActivity.java <<'EOF'
          package com.ruthra407.tailoring;

          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          import android.window.OnBackInvokedCallback;
          import android.window.OnBackInvokedDispatcher;

          public class MainActivity extends BridgeActivity {

              private OnBackInvokedCallback backCallback;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  if (Build.VERSION.SDK_INT >= 33) {
                      backCallback = () -> {
                          WebView webView = getBridge() == null
                                  ? null
                                  : getBridge().getWebView();

                          if (webView != null && webView.canGoBack()) {
                              webView.goBack();
                          } else {
                              finish();
                          }
                      };

                      getOnBackInvokedDispatcher()
                              .registerOnBackInvokedCallback(
                                      OnBackInvokedDispatcher.PRIORITY_DEFAULT,
                                      backCallback
                              );
                  }
              }

              @Override
              protected void onDestroy() {
                  if (Build.VERSION.SDK_INT >= 33 && backCallback != null) {
                      getOnBackInvokedDispatcher()
                              .unregisterOnBackInvokedCallback(backCallback);
                      backCallback = null;
                  }

                  super.onDestroy();
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (Build.VERSION.SDK_INT < 33) {
                      WebView webView = getBridge() == null
                              ? null
                              : getBridge().getWebView();

                      if (webView != null && webView.canGoBack()) {
                          webView.goBack();
                      } else {
                          super.onBackPressed();
                      }
                  }
              }
          }
          EOF

      - name: Enable Predictive Back
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "android:enableOnBackInvokedCallback=" not in s:
              s = s.replace(
                  "<application",
                  '<application android:enableOnBackInvokedCallback="true"',
                  1
              )

          p.write_text(s)
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: New-Fashion-Tailoring-Android16-BackFix
          path: android/app/build/outputs/apk/debug/app-debug.apk
