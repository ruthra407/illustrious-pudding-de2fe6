name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Local Notifications
        run: npm install --no-save @capacitor/local-notifications@8.2.1

      - name: Install Capacitor Contacts
        run: |
          npm install --save @capacitor/contacts@1.0.1
          npx cap sync android

      - name: Sync root web files to www
        run: |
          set -e

          if [ ! -f index.html ]; then
            echo "ERROR: root index.html not found."
            exit 1
          fi

          mkdir -p www
          cp index.html www/index.html

          if [ -f manifest.json ]; then
            cp manifest.json www/manifest.json
          fi

          if [ -f icon-192.png ]; then
            cp icon-192.png www/icon-192.png
          fi

          if [ -f icon-512.png ]; then
            cp icon-512.png www/icon-512.png
          fi

          cmp -s index.html www/index.html

      - name: Commit synchronized www files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add www/index.html

          if [ -f www/manifest.json ]; then git add www/manifest.json; fi
          if [ -f www/icon-192.png ]; then git add www/icon-192.png; fi
          if [ -f www/icon-512.png ]; then git add www/icon-512.png; fi

          if git diff --cached --quiet; then
            echo "www is already up to date."
          else
            git commit -m "Sync web files to www"
            git push origin HEAD:main
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.READ_CONTACTS",
              "android.permission.WRITE_CONTACTS",
          ]

          match = re.search(r"<manifest\b[^>]*>", text, re.S)

          if not match:
              raise SystemExit("ERROR: manifest tag not found.")

          insert = ""

          for permission in permissions:
              if permission not in text:
                  insert += f'\n    <uses-permission android:name="{permission}" />'

          if insert:
              pos = match.end()
              text = text[:pos] + insert + "\n" + text[pos:]

          manifest.write_text(text)
          PY

      - name: Restore stable signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/newfashion-stable.jks

          test -s android/app/newfashion-stable.jks

          echo "Stable keystore restored."

      - name: Configure stable signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          signing_block = '''
              signingConfigs {
                  stable {
                      storeFile file("newfashion-stable.jks")
                      storePassword "NewFashion@2026"
                      keyAlias "newfashion"
                      keyPassword "NewFashion@2026"
                  }
              }
          '''

          if "signingConfigs {" not in text:
              text = text.replace(
                  "    buildTypes {",
                  signing_block + "\n    buildTypes {",
                  1
              )

          if "signingConfig signingConfigs.stable" not in text:
              text = text.replace(
                  "release {",
                  "release {\n            signingConfig signingConfigs.stable",
                  1
              )

          gradle.write_text(text)
          PY

      - name: Set APK versionCode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          version_code = int("${{ github.run_number }}") + 1000

          text = re.sub(
              r"versionCode\s+\d+",
              f"versionCode {version_code}",
              text,
              count=1
          )

          gradle.write_text(text)
          print(f"APK versionCode set to {version_code}.")
          PY

      - name: Make Gradle Wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK build successful."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: New-Fashion-Tailoring-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
