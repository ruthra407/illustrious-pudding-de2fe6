name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund \
            @capacitor/local-notifications@8.2.1 \
            @capacitor/app@8.0.0 \
            @capacitor/contacts@1.0.1

      - name: Sync root web files to www
        run: |
          set -e

          test -f index.html

          mkdir -p www

          cp index.html www/index.html

          if [ -f manifest.json ]; then
            cp manifest.json www/manifest.json
          fi

          if [ -f icon-192.png ]; then
            cp icon-192.png www/icon-192.png
          fi

          if [ -f icon-512.png ]; then
            cp icon-512.png www/icon-512.png
          fi

          echo "Web files synchronized successfully."

      - name: Commit synchronized www files
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add www/index.html

          if [ -f www/manifest.json ]; then
            git add www/manifest.json
          fi

          if [ -f www/icon-192.png ]; then
            git add www/icon-192.png
          fi

          if [ -f www/icon-512.png ]; then
            git add www/icon-512.png
          fi

          if git diff --cached --quiet; then
            echo "www is already up to date."
          else
            git commit -m "Sync web files to www [skip ci]"
            git push origin HEAD:main
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Add Android permissions
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.READ_CONTACTS",
              "android.permission.WRITE_CONTACTS",
          ]

          match = re.search(r"<manifest\b[^>]*>", text, re.S)

          if not match:
              raise SystemExit("ERROR: manifest tag not found.")

          insert = ""

          for permission in permissions:
              if permission not in text:
                  insert += (
                      f'\n    <uses-permission '
                      f'android:name="{permission}" />'
                  )

          if insert:
              pos = match.end()
              text = text[:pos] + insert + "\n" + text[pos:]

          manifest.write_text(text)

          print("Android permissions verified/added.")

      - name: Restore stable signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/newfashion-release.jks

          test -s android/app/newfashion-release.jks

          echo "Stable keystore restored."

      - name: Configure Android signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is missing."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          text = re.sub(
              r'\n\s*signingConfigs\s*\{.*?\n\s*\}\s*\n(?=\s*buildTypes\s*\{)',
              '\n',
              text,
              count=1,
              flags=re.S
          )

          signing = '''
              signingConfigs {
                  stable {
                      storeFile file("newfashion-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

          '''

          if "signingConfigs {" not in text:
              text = text.replace(
                  "    buildTypes {",
                  signing + "    buildTypes {",
                  1
              )

          text = re.sub(
              r'(debug\s*\{)(?!\s*signingConfig)',
              r'\1\n            signingConfig signingConfigs.stable',
              text,
              count=1
          )

          release_match = re.search(
              r'release\s*\{.*?\n\s*\}',
              text,
              re.S
          )

          if release_match:
              release_block = release_match.group(0)

              if "signingConfig signingConfigs.stable" not in release_block:
                  release_block = release_block.replace(
                      "release {",
                      "release {\n"
                      "            signingConfig signingConfigs.stable",
                      1
                  )

                  text = (
                      text[:release_match.start()]
                      + release_block
                      + text[release_match.end():]
                  )

          gradle.write_text(text)

          print("Android signing configured securely.")
          print("Keystore: newfashion-release.jks")
          print("Alias:", os.environ["KEY_ALIAS"])
          PY

      - name: Set APK versionCode
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          version_code = int(os.environ["GITHUB_RUN_NUMBER"]) + 1000

          if not re.search(r"versionCode\s+\d+", text):
              raise SystemExit("ERROR: versionCode not found.")

          text = re.sub(
              r"versionCode\s+\d+",
              f"versionCode {version_code}",
              text,
              count=1
          )

          gradle.write_text(text)

          print(f"APK versionCode set to {version_code}.")
          PY

      - name: Make Gradle Wrapper executable
        run: chmod +x android/gradlew

      - name: Verify stable signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          test -f android/app/newfashion-release.jks

          keytool -list -v \
            -keystore android/app/newfashion-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "SIGNING KEY VERIFIED SUCCESSFULLY."

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --build-cache --parallel

      - name: Verify APK
        run: |
          set -e

          test -f android/app/build/outputs/apk/debug/app-debug.apk

          echo "APK build successful."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: New-Fashion-Tailoring-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
