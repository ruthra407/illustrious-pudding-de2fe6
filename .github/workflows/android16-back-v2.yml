name: Android 16 Back Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ruthra407.tailoring",
            "appName": "New Fashion Tailoring",
            "webDir": "www"
          }
          EOF

          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp icon-192.png www/
          cp icon-512.png www/

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android Back
        run: |
          MAIN="android/app/src/main/java/com/ruthra407/tailoring/MainActivity.java"

          cat > "$MAIN" <<'EOF'
          package com.ruthra407.tailoring;

          import android.os.Bundle;
          import android.webkit.WebView;

          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  getOnBackPressedDispatcher().addCallback(
                      this,
                      new OnBackPressedCallback(true) {
                          @Override
                          public void handleOnBackPressed() {
                              WebView webView = getBridge() == null
                                      ? null
                                      : getBridge().getWebView();

                              if (webView != null && webView.canGoBack()) {
                                  webView.goBack();
                              } else {
                                  setEnabled(false);
                                  getOnBackPressedDispatcher().onBackPressed();
                              }
                          }
                      }
                  );
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "android:enableOnBackInvokedCallback=" not in s:
              s = s.replace(
                  "<application",
                  '<application android:enableOnBackInvokedCallback="true"',
                  1
              )

          p.write_text(s)
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: New-Fashion-Tailoring-Android16-BackFix-v2
          path: android/app/build/outputs/apk/debug/app-debug.apk
