name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ruthra407.tailoring",
            "appName": "New Fashion Tailoring",
            "webDir": "www"
          }
          EOF

          mkdir -p www

          cp index.html www/
          cp manifest.json www/
          cp icon-192.png www/
          cp icon-512.png www/

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android Back
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/ruthra407/tailoring/MainActivity.java"

          mkdir -p "$(dirname "$MAIN_ACTIVITY")"

          cat > "$MAIN_ACTIVITY" <<'EOF'
          package com.ruthra407.tailoring;

          import android.os.Bundle;
          import android.webkit.WebView;

          import androidx.activity.OnBackPressedCallback;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getOnBackPressedDispatcher().addCallback(
                          this,
                          new OnBackPressedCallback(true) {

                              @Override
                              public void handleOnBackPressed() {

                                  WebView webView = getBridge() == null
                                          ? null
                                          : getBridge().getWebView();

                                  if (webView == null) {
                                      return;
                                  }

                                  webView.post(() -> {
                                      webView.evaluateJavascript(
                                              "(function(){"
                                              + "if(typeof window.__nfAndroidBack === 'function'){"
                                              + "window.__nfAndroidBack();"
                                              + "}"
                                              + "})();",
                                              null
                                      );
                                  });
                              }
                          }
                  );
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          if "android:enableOnBackInvokedCallback=" not in text:
              text = text.replace(
                  "<application",
                  '<application android:enableOnBackInvokedCallback="true"',
                  1
              )

          manifest.write_text(text)
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: New-Fashion-Tailoring-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
