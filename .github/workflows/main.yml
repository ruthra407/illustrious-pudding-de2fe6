name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Node project
        shell: bash
        run: |
          set -e

          npm init -y

          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: Prepare web assets
        shell: bash
        run: |
          set -e

          mkdir -p www

          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          cp index.html www/index.html

          if [ -f manifest.json ]; then
            cp manifest.json www/manifest.json
          fi

          if [ -f icon-192.png ]; then
            cp icon-192.png www/icon-192.png
          fi

          if [ -f icon-512.png ]; then
            cp icon-512.png www/icon-512.png
          fi

          echo "Web assets prepared."

      - name: Create Capacitor config
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.newfashion.tailoring",
            "appName": "New Fashion Tailoring",
            "webDir": "www"
          }
          EOF

      - name: Backup native Java files
        shell: bash
        run: |
          set -e

          BASE="android/app/src/main/java/com/newfashion/tailoring"
          BACKUP="/tmp/nf-native"

          mkdir -p "$BACKUP"

          for FILE in \
            MainActivity.java \
            ReminderReceiver.java \
            ReminderScheduler.java \
            BootReceiver.java
          do
            if [ ! -f "$BASE/$FILE" ]; then
              echo "ERROR: Missing $BASE/$FILE"
              exit 1
            fi

            cp "$BASE/$FILE" "$BACKUP/$FILE"
            echo "Backed up $FILE"
          done

      - name: Create fresh Android project
        shell: bash
        run: |
          set -e

          rm -rf android

          npx cap add android

      - name: Restore native Java files
        shell: bash
        run: |
          set -e

          BASE="android/app/src/main/java/com/newfashion/tailoring"
          BACKUP="/tmp/nf-native"

          mkdir -p "$BASE"

          cp "$BACKUP/MainActivity.java" "$BASE/MainActivity.java"
          cp "$BACKUP/ReminderReceiver.java" "$BASE/ReminderReceiver.java"
          cp "$BACKUP/ReminderScheduler.java" "$BASE/ReminderScheduler.java"
          cp "$BACKUP/BootReceiver.java" "$BASE/BootReceiver.java"

          echo "Native Java files restored."

      - name: Configure Android manifest
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          ANDROID_NS = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ANDROID_NS)

          A = lambda name: "{" + ANDROID_NS + "}" + name

          tree = ET.parse(path)
          root = tree.getroot()

          permissions = [
              "android.permission.READ_CONTACTS",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.WAKE_LOCK"
          ]

          existing_permissions = set()

          for item in root.findall("uses-permission"):
              name = item.get(A("name"))
              if name:
                  existing_permissions.add(name)

          for permission in permissions:
              if permission not in existing_permissions:
                  element = ET.Element(
                      "uses-permission",
                      {A("name"): permission}
                  )
                  root.insert(0, element)

          application = root.find("application")

          if application is None:
              raise RuntimeError("Android application element not found")

          activities = application.findall("activity")

          main_activity = None

          for activity in activities:
              name = activity.get(A("name"), "")

              if name.endswith("MainActivity"):
                  main_activity = activity
                  break

          if main_activity is None:
              main_activity = ET.SubElement(
                  application,
                  "activity"
              )

          main_activity.set(
              A("name"),
              "com.newfashion.tailoring.MainActivity"
          )

          main_activity.set(
              A("exported"),
              "true"
          )

          def find_receiver(class_name):
              for receiver in application.findall("receiver"):
                  if receiver.get(A("name")) == class_name:
                      return receiver
              return None

          reminder_receiver = find_receiver(
              "com.newfashion.tailoring.ReminderReceiver"
          )

          if reminder_receiver is None:
              reminder_receiver = ET.SubElement(
                  application,
                  "receiver"
              )

          reminder_receiver.set(
              A("name"),
              "com.newfashion.tailoring.ReminderReceiver"
          )

          reminder_receiver.set(
              A("exported"),
              "false"
          )

          boot_receiver = find_receiver(
              "com.newfashion.tailoring.BootReceiver"
          )

          if boot_receiver is None:
              boot_receiver = ET.SubElement(
                  application,
                  "receiver"
              )

          boot_receiver.set(
              A("name"),
              "com.newfashion.tailoring.BootReceiver"
          )

          boot_receiver.set(
              A("enabled"),
              "true"
          )

          boot_receiver.set(
              A("exported"),
              "false"
          )

          existing_actions = set()

          for intent_filter in boot_receiver.findall("intent-filter"):
              for action in intent_filter.findall("action"):
                  name = action.get(A("name"))
                  if name:
                      existing_actions.add(name)

          intent_filter = None

          if not boot_receiver.findall("intent-filter"):
              intent_filter = ET.SubElement(
                  boot_receiver,
                  "intent-filter"
              )
          else:
              intent_filter = boot_receiver.findall(
                  "intent-filter"
              )[0]

          required_actions = [
              "android.intent.action.BOOT_COMPLETED",
              "android.intent.action.MY_PACKAGE_REPLACED"
          ]

          for action_name in required_actions:
              if action_name not in existing_actions:
                  action = ET.SubElement(
                      intent_filter,
                      "action"
                  )
                  action.set(
                      A("name"),
                      action_name
                  )

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("AndroidManifest.xml configured.")
          PY

      - name: Verify native files
        shell: bash
        run: |
          set -e

          BASE="android/app/src/main/java/com/newfashion/tailoring"

          test -f "$BASE/MainActivity.java"
          test -f "$BASE/ReminderReceiver.java"
          test -f "$BASE/ReminderScheduler.java"
          test -f "$BASE/BootReceiver.java"

          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradlew

          echo "All Android files verified."

      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          npx cap sync android

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd android

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: New-Fashion-Tailoring-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
