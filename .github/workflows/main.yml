name: Create Android Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Install Capacitor
        run: |
          npm install @capacitor/core
          npm install @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: Prepare web files
        run: |
          mkdir -p www

          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          cp index.html www/index.html

          if [ -f manifest.json ]; then
            cp manifest.json www/manifest.json
          fi

          if [ -f icon-192.png ]; then
            cp icon-192.png www/icon-192.png
          fi

          if [ -f icon-512.png ]; then
            cp icon-512.png www/icon-512.png
          fi

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.newfashion.tailoring",
            "appName": "New Fashion Tailoring",
            "webDir": "www"
          }
          EOF

      - name: Check Android project
        run: |
          if [ -d android ] && [ ! -f android/gradlew ]; then
            echo "Incomplete Android project found."
            echo "Removing incomplete android folder..."
            rm -rf android
          fi

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            echo "Android project not found."
            echo "Creating Android project..."
            npx cap add android
          else
            echo "Android project already exists."
            echo "Skipping cap add android."
          fi

      - name: Sync Android project
        run: |
          npx cap sync android

      - name: Verify Android project
        run: |
          test -d android
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

          echo "======================================"
          echo "Android project is ready."
          echo "======================================"

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android
          git add package.json package-lock.json
          git add capacitor.config.json
          git add www

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Create or update Android project"
            git push
          fi
