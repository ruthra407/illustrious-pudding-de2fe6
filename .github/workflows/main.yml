name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Node project
        shell: bash
        run: |
          npm init -y

          npm install @capacitor/core@latest @capacitor/android@latest

          npm install --save-dev @capacitor/cli@latest

      - name: Prepare web assets
        shell: bash
        run: |
          set -e

          mkdir -p www

          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          cp index.html www/index.html

          if [ -f manifest.json ]; then
            cp manifest.json www/manifest.json
          fi

          if [ -f icon-192.png ]; then
            cp icon-192.png www/icon-192.png
          fi

          if [ -f icon-512.png ]; then
            cp icon-512.png www/icon-512.png
          fi

          echo "Web assets:"
          find www -maxdepth 1 -type f -print

      - name: Create Capacitor config
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.newfashion.tailoring",
            "appName": "New Fashion Tailoring",
            "webDir": "www"
          }
          EOF

          cat capacitor.config.json

      - name: Check existing Android project
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "ERROR: android directory not found."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew not found."
            exit 1
          fi

          echo "Existing Android project found."

      - name: Check native Java files
        shell: bash
        run: |
          set -e

          BASE="android/app/src/main/java/com/newfashion/tailoring"

          echo "Checking native Java files..."

          for FILE in \
            MainActivity.java \
            ReminderReceiver.java \
            ReminderScheduler.java \
            BootReceiver.java
          do
            if [ ! -f "$BASE/$FILE" ]; then
              echo "ERROR: Missing $BASE/$FILE"
              exit 1
            fi

            echo "OK: $BASE/$FILE"
          done

          echo "All required Java files are present."

      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          npx cap sync android

      - name: Verify native Java files after sync
        shell: bash
        run: |
          set -e

          BASE="android/app/src/main/java/com/newfashion/tailoring"

          echo "Checking Java files after Capacitor sync..."

          test -f "$BASE/MainActivity.java"
          test -f "$BASE/ReminderReceiver.java"
          test -f "$BASE/ReminderScheduler.java"
          test -f "$BASE/BootReceiver.java"

          echo "Native Java files verified."

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd android

          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: New-Fashion-Tailoring-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
