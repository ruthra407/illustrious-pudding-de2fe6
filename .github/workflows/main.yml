name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Node project
        shell: bash
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: Prepare web assets
        shell: bash
        run: |
          mkdir -p www

          test -f index.html
          cp index.html www/index.html

          if [ -f manifest.json ]; then
            cp manifest.json www/manifest.json
          fi

          if [ -f icon-192.png ]; then
            cp icon-192.png www/icon-192.png
          fi

          if [ -f icon-512.png ]; then
            cp icon-512.png www/icon-512.png
          fi

      - name: Create Capacitor config
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.newfashion.tailoring",
            "appName": "New Fashion Tailoring",
            "webDir": "www"
          }
          EOF

      - name: Check Android project
        shell: bash
        run: |
          if [ -d "android" ]; then
            echo "Existing Android project found."
            echo "Skipping npx cap add android."
          else
            echo "Android project not found."
            npx cap add android
          fi

      - name: Sync Capacitor
        shell: bash
        run: |
          npx cap sync android

      - name: Check Native Java files
        shell: bash
        run: |
          echo "Checking native Java files..."

          test -f android/app/src/main/java/com/newfashion/tailoring/MainActivity.java
          test -f android/app/src/main/java/com/newfashion/tailoring/ReminderReceiver.java
          test -f android/app/src/main/java/com/newfashion/tailoring/ReminderScheduler.java
          test -f android/app/src/main/java/com/newfashion/tailoring/BootReceiver.java

          echo "All required Java files are present."

      - name: Build Debug APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: New-Fashion-Tailoring-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
